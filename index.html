<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle Adventures</title>
<style>
:root{
  --ink:#2b2750; --ink2:#5d5887; --lav:#7a66f0; --lav-l:#ece8ff; --sky:#4aa8ee; --mint:#26b28e;
  --peach:#ff9f73; --butter:#ffd35c; --coral:#ff6b6b;
  --font:"Avenir Next","Nunito","Segoe UI Rounded","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --bg1:#e9e4ff; --bg2:#ffe9dc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:radial-gradient(1200px 800px at 50% 0%,#36306a,#1d1938 70%);}
button{font-family:inherit;color:inherit;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;border-radius:22px;overflow:hidden;
  background:radial-gradient(1100px 700px at 12% 8%,var(--bg1),transparent 62%),
             radial-gradient(1000px 760px at 92% 95%,var(--bg2),transparent 60%),#f8f6ff;
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);}
#bg,#geo,#slides,#fx{position:absolute;inset:0}
#bg{pointer-events:none}
#geo{pointer-events:none;overflow:visible}
#slides{pointer-events:none}
#fx{pointer-events:none;z-index:6}

/* ---------- background decor ---------- */
.fl{animation:floaty 9s ease-in-out infinite alternate}
.fl2{animation:floaty 12s ease-in-out infinite alternate-reverse}
.fl3{animation:drift 30s linear infinite alternate}
.tw{animation:twinkle 3.2s ease-in-out infinite}
@keyframes floaty{from{transform:translateY(-10px) rotate(-4deg)}to{transform:translateY(12px) rotate(5deg)}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1.1)}}
.fl,.fl2,.tw{transform-box:fill-box;transform-origin:center}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;pointer-events:none}
.slide>*{pointer-events:auto}
.slide.leaving,.slide.leaving *{pointer-events:none!important}
.kicker{position:absolute;left:90px;top:48px;font-size:17px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:#6a57e8;background:rgba(255,255,255,.85);padding:8px 16px;border-radius:999px;
  box-shadow:0 4px 14px rgba(106,87,232,.14);white-space:nowrap}
.title{position:absolute;left:90px;top:92px;margin:0;font-size:50px;line-height:1.08;font-weight:800;letter-spacing:-.015em;white-space:nowrap}
.col{position:absolute;display:flex;flex-direction:column;gap:16px}
.card{background:rgba(255,255,255,.9);border-radius:26px;padding:22px 26px;
  box-shadow:0 14px 34px rgba(76,58,170,.12),inset 0 1px 0 #fff;border:1.5px solid rgba(122,102,240,.16)}
.card h3{margin:0 0 8px;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#7a66f0}
.q{font-size:27px;line-height:1.3;font-weight:600}
.q b{font-weight:800}
.small{font-size:20px;line-height:1.4;color:var(--ink2)}
.build:not(.in){display:none!important}
.opts{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.opt{font-size:26px;font-weight:800;min-width:110px;padding:12px 20px;border-radius:18px;border:2.5px solid #d7d0ff;background:#fff;
  transition:transform .18s,box-shadow .18s,border-color .2s,background .2s,opacity .2s;box-shadow:0 4px 0 #d7d0ff}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:#a796ff;box-shadow:0 6px 0 #c3b8ff}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #c3b8ff}
.opt:disabled{cursor:default}
.opt.correct{background:#e3fbf2;border-color:#26b28e;box-shadow:0 4px 0 #9fe6cc;color:#14785d}
.opt.wrong{background:#fff3f1;border-color:#ffb3a8;box-shadow:0 4px 0 #ffd2cb;color:#b85a4d;opacity:.8}
.opt.picked{outline:3px solid rgba(122,102,240,.35);outline-offset:3px}
.fb{margin-top:12px;font-size:21px;line-height:1.4;min-height:0;color:var(--ink2)}
.fb:empty{display:none}
.fb.good{color:#14785d}.fb.hint{color:#9a5a12}
.chips{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:30px;font-weight:800;padding:8px 18px;border-radius:16px;background:#fff;border:2px solid #eee;font-variant-numeric:tabular-nums}
.chip.yel{background:#fff6d6;border-color:#ffd35c}.chip.sky{background:#e6f4ff;border-color:#86c8ff}
.chip.peach{background:#fff0e7;border-color:#ffb48f}.chip.mint{background:#e4fbf2;border-color:#7fe0bd}
.chip.coral{background:#ffecec;border-color:#ff9a9a}
.eqsign{font-size:32px;font-weight:800;color:#7a66f0}
.term{margin-top:14px;font-size:30px;font-weight:800;background:linear-gradient(90deg,#7a66f0,#ff6b9a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{border-radius:22px;padding:18px 24px;font-size:26px;font-weight:800;line-height:1.3;
  background:linear-gradient(135deg,#fff7da,#ffeaf2);border:2.5px solid #ffd35c;box-shadow:0 10px 26px rgba(255,180,60,.22);position:relative}
.rule::before{content:"★ RULE";display:block;font-size:14px;letter-spacing:.16em;color:#d08a00;margin-bottom:4px}
.rule.conv::before{content:"★ THE CONVERSE"}
.rule.def::before{content:"✎ DEFINITION";color:#6a57e8}
.rule.def{background:linear-gradient(135deg,#f1eeff,#e8f6ff);border-color:#b9adff;box-shadow:0 10px 26px rgba(122,102,240,.16)}
.eq{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.5}
.eq .dim{color:#9a95bd;font-weight:700;font-size:20px;margin-left:8px}
.eqline{opacity:0;transform:translateX(-14px);transition:opacity .45s,transform .5s cubic-bezier(.2,.9,.3,1.3)}
.eqline.in{opacity:1;transform:none}
.bubble{position:absolute;background:#fff;border-radius:24px;padding:18px 22px;font-size:23px;line-height:1.35;font-weight:600;
  box-shadow:0 12px 30px rgba(76,58,170,.15);border:2px solid #e6e0ff}
.bubble::after{content:"";position:absolute;width:22px;height:22px;background:#fff;border:2px solid #e6e0ff;border-top:none;border-left:none;transform:rotate(-45deg);right:-12px;top:42%}
.bubble.tail-down::after{right:auto;left:70%;top:auto;bottom:-12px;transform:rotate(45deg)}
.bubble .who{display:block;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7a66f0;font-weight:800;margin-bottom:4px}
.btn{font-size:21px;font-weight:800;padding:12px 20px;border-radius:16px;border:2px solid #d7d0ff;background:#fff;box-shadow:0 4px 0 #d7d0ff;transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #c3b8ff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c3b8ff}
.btn.primary{background:linear-gradient(135deg,#8b77ff,#6a57e8);color:#fff;border-color:#5a47d6;box-shadow:0 4px 0 #4a39b8}
.btn.sm{font-size:17px;padding:10px 14px;border-radius:14px}
.btn.on{background:#ece8ff;border-color:#7a66f0}
.numform{display:flex;gap:12px;margin-top:14px;align-items:center}
.numform input{width:150px;font-size:28px;font-weight:800;padding:10px 14px;border-radius:16px;border:2.5px solid #d7d0ff;font-family:inherit;color:var(--ink);text-align:center}
.numform input:focus{outline:none;border-color:#7a66f0;box-shadow:0 0 0 4px rgba(122,102,240,.18)}
.numform .deg{font-size:28px;font-weight:800;margin-left:-6px}

/* slide 1 hero */
.hero{position:absolute;left:110px;top:200px;width:720px}
.hero .title{position:relative;left:0;top:0;font-size:96px;line-height:.95;letter-spacing:-.02em;white-space:normal}
.hero .title>span{display:block;white-space:nowrap}
.hero .ltr{display:inline-block;opacity:0;transform:translateY(40px) rotate(6deg);animation:ltrIn .8s cubic-bezier(.2,.9,.3,1.25) forwards}
@keyframes ltrIn{to{opacity:1;transform:none}}
.grad1{background:linear-gradient(100deg,#6a57e8 0%,#9b6bff 50%,#ff7aa8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad2{background:linear-gradient(100deg,#ff8a5c 0%,#ffb03b 45%,#26b28e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{margin:26px 0 0;font-size:31px;font-weight:700;color:#5d5887}
.hero-q{margin:18px 0 0;font-size:26px;line-height:1.35;color:var(--ink);max-width:620px}
.start{margin-top:40px;font-size:27px;font-weight:800;padding:18px 34px;border-radius:999px;border:none;color:#fff;
  background:linear-gradient(135deg,#ff7a7a,#ff9e5c);box-shadow:0 8px 0 #e0574f,0 18px 34px rgba(255,110,90,.35);transition:transform .15s,box-shadow .15s}
.start:hover{transform:translateY(-3px)}
.start:active{transform:translateY(4px);box-shadow:0 3px 0 #e0574f}
.start.attn{animation:attn 2.4s ease-in-out infinite}
@keyframes attn{0%,70%,100%{transform:none}78%{transform:translateY(-6px) scale(1.04)}86%{transform:none}92%{transform:translateY(-3px) scale(1.02)}}

/* lab */
.lab-slider{position:absolute;left:170px;top:808px;width:780px;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.85);
  padding:12px 24px;border-radius:999px;box-shadow:0 8px 22px rgba(76,58,170,.12)}
.lab-slider label{font-size:19px;font-weight:800;white-space:nowrap;color:#d14f4f}
.lab-slider input{flex:1;accent-color:#ff6b6b;height:28px}
.lab-slider .ro{font-size:20px;font-weight:800;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.toggle{display:inline-flex;background:#efecff;border-radius:999px;padding:5px;gap:4px;margin-top:6px}
.toggle button{border:none;background:transparent;font-size:20px;font-weight:800;padding:10px 18px;border-radius:999px;color:#5d5887;transition:background .25s,color .25s}
.toggle button.on{background:#fff;color:#6a57e8;box-shadow:0 3px 10px rgba(76,58,170,.18)}
.dots{display:flex;gap:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e1dcff;transition:background .3s,transform .3s}
.dots i.cur{background:#a796ff;transform:scale(1.25)}
.dots i.done{background:#26b28e}
.qnum{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#7a66f0;font-weight:800}
.ptext{font-size:22px;line-height:1.38}
.ptext li{margin:6px 0}
.ptext ul{margin:8px 0 0;padding-left:24px}
.ph{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#7a66f0}
.ph2{font-size:27px;font-weight:800;margin:2px 0 6px}
.celebrate{font-size:28px;font-weight:800;line-height:1.3;background:linear-gradient(90deg,#6a57e8,#ff6b9a,#ff9e5c);-webkit-background-clip:text;background-clip:text;color:transparent}
.emph{animation:emph .9s cubic-bezier(.2,.9,.3,1.4)}
@keyframes emph{0%{transform:scale(.9)}45%{transform:scale(1.05)}100%{transform:scale(1)}}

/* ---------- Pip ---------- */
#pip{position:absolute;left:0;top:0;width:160px;height:160px;transform-origin:0 0;z-index:5;pointer-events:none}
#pip svg{overflow:visible}
.pip-float{animation:pipfloat 3.6s ease-in-out infinite}
@keyframes pipfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pip-eyes{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.armR,.armL{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.armR{transform:rotate(55deg)}.armL{transform:rotate(-55deg)}
.mood-wave .armR{animation:wave 1.1s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-80deg)}to{transform:rotate(-30deg)}}
.mood-cheer .pip-body{animation:hop .55s ease-in-out infinite alternate}
.mood-cheer .armR{transform:rotate(-60deg)}.mood-cheer .armL{transform:rotate(60deg)}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.mood-think .armL{transform:rotate(-120deg)}
.mouth-open{display:none}.mood-cheer .mouth-open,.mood-wave .mouth-open{display:block}
.mood-cheer .mouth-smile,.mood-wave .mouth-smile{display:none}
.pip-star{animation:starspin 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes starspin{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(20deg) scale(1.15)}}

/* geometry styling */
.halo{animation:halo 1.6s ease-in-out infinite}
@keyframes halo{0%,100%{stroke-width:10px}50%{stroke-width:22px}}
.flow{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-.1}}
.dotpulse{animation:dotpulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dotpulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.6);opacity:0}}
.handle{cursor:grab;pointer-events:auto}
.handle:active{cursor:grabbing}
.handle-ring{animation:dotpulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.wlbl,.wval,.lname{font-family:var(--font);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-linejoin:round}

/* sparkles */
.spark{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}

/* ---------- presenter chrome ---------- */
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:rgba(25,21,52,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:6px 8px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.35);color:#fff;z-index:20;user-select:none}
#bar button{background:transparent;border:none;color:#dcd6ff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s,color .2s}
#bar button:hover{background:rgba(255,255,255,.12);color:#fff}
#bar button:focus-visible{outline:2px solid #a796ff;outline-offset:1px}
#bar button.nextb{align-items:center;width:auto;padding:0 18px 0 20px;border-radius:999px;background:linear-gradient(135deg,#8b77ff,#6a57e8);color:#fff;font-weight:800;font-size:15px;gap:6px;display:flex}
#bar button.nextb:hover{filter:brightness(1.1)}
#bar button.on{color:#ffd35c}
#bar svg{width:20px;height:20px}
#count{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;letter-spacing:.06em;min-width:74px;text-align:center;color:#fff}
#count small{color:#a59ed6;font-weight:700}
.sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 4px}
#prog{position:absolute;left:0;bottom:0;height:5px;width:100%;background:rgba(122,102,240,.12);z-index:7}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b77ff,#ff7aa8,#ffb03b);border-radius:0 4px 4px 0;transition:width .8s cubic-bezier(.65,0,.35,1)}
#notes{position:fixed;right:16px;bottom:70px;width:380px;max-width:calc(100vw - 32px);max-height:60vh;overflow:auto;background:rgba(25,21,52,.94);color:#ece8ff;
  border-radius:20px;padding:18px 20px;font-size:15px;line-height:1.5;z-index:21;box-shadow:0 20px 50px rgba(0,0,0,.4);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#notes.show{opacity:1;transform:none;pointer-events:auto}
#notes h4{margin:0 0 2px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#a796ff}
#notes .nt{font-size:18px;font-weight:800;margin-bottom:8px;color:#fff}
#notes ul{padding-left:18px;margin:6px 0}
#rotate{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(25,21,52,.85);color:#fff;font-size:13px;padding:6px 14px;border-radius:999px;display:none;z-index:22}
@media (orientation:portrait) and (max-width:700px){#rotate{display:block}}
@media (max-width:520px){#bar{gap:1px;padding:4px 5px;bottom:6px}#bar button{width:32px;height:32px}#bar svg{width:17px;height:17px}
  #bar button.nextb{padding:0 12px;font-size:13px}#count{min-width:54px;font-size:13px}.sep{display:none}}

body.reduced .fl,body.reduced .fl2,body.reduced .fl3,body.reduced .tw,body.reduced .pip-float,body.reduced .halo,
body.reduced .flow,body.reduced .dotpulse,body.reduced .handle-ring,body.reduced .start.attn,body.reduced .pip-star,
body.reduced .mood-cheer .pip-body,body.reduced .mood-wave .armR{animation:none!important}
body.reduced .hero .ltr{animation-duration:.01s!important;animation-delay:0s!important}
</style>
</head>
<body>
<div id="rotate">Tip: rotate your device for a bigger slide</div>
<div id="stage" role="region" aria-label="Presentation slide">
  <!-- whimsical background -->
  <svg id="bg" viewBox="0 0 1600 900" aria-hidden="true">
    <defs>
      <linearGradient id="gTri" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#cfc6ff"/><stop offset="1" stop-color="#ffd1e6"/></linearGradient>
      <linearGradient id="gCirc" x1="0" x2="1"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#c9f5e4"/></linearGradient>
    </defs>
    <g class="fl3" opacity=".9">
      <g fill="#fff" opacity=".75"><ellipse cx="240" cy="790" rx="120" ry="34"/><ellipse cx="300" cy="770" rx="70" ry="40"/><ellipse cx="200" cy="772" rx="54" ry="30"/></g>
      <g fill="#fff" opacity=".6"><ellipse cx="1330" cy="110" rx="110" ry="28"/><ellipse cx="1380" cy="92" rx="64" ry="34"/><ellipse cx="1290" cy="96" rx="44" ry="24"/></g>
    </g>
    <g opacity=".55">
      <path class="fl" d="M60 380 L118 290 L176 380 Z" fill="url(#gTri)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <circle class="fl2" cx="1520" cy="420" r="36" fill="url(#gCirc)"/>
      <rect class="fl" x="1050" y="780" width="54" height="54" rx="14" fill="#ffe3a6" transform="rotate(14 1077 807)"/>
      <path class="fl2" d="M770 70 a46 46 0 0 1 92 0 Z" fill="none" stroke="#c7bdff" stroke-width="5"/>
      <path class="fl" d="M1460 640 l26 0 M1473 627 l0 26" stroke="#ffb48f" stroke-width="6" stroke-linecap="round"/>
      <path class="fl2" d="M40 600 l22 0 M51 589 l0 22" stroke="#86c8ff" stroke-width="6" stroke-linecap="round"/>
      <circle class="fl" cx="950" cy="860" r="16" fill="#c9f5e4"/>
    </g>
    <g fill="#ffd35c">
      <path class="tw" d="M480 60 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
      <path class="tw" style="animation-delay:1.1s" d="M1180 220 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#b9adff"/>
      <path class="tw" style="animation-delay:.5s" d="M120 160 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ff9ec4"/>
      <path class="tw" style="animation-delay:2s" d="M1540 820 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
      <path class="tw" style="animation-delay:1.6s" d="M700 840 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#86c8ff"/>
    </g>
  </svg>

  <svg id="geo" viewBox="0 0 1600 900" aria-label="Geometry diagram">
    <defs>
      <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4c3aaa" flood-opacity=".13"/></filter>
      <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#f08a3c"/></marker>
    </defs>
    <g id="panels"></g>
    <g id="d2"></g>
    <g id="d1"></g>
  </svg>

  <div id="slides"></div>

  <div id="pip" aria-hidden="true">
    <svg viewBox="0 0 160 160" width="160" height="160">
      <defs>
        <linearGradient id="pipBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6a9ff"/><stop offset="1" stop-color="#7563ee"/></linearGradient>
        <linearGradient id="pipBelly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <ellipse cx="80" cy="152" rx="46" ry="6" fill="#2b2750" opacity=".13"/>
      <g class="pip-float"><g class="pip-body">
        <path d="M80 70 Q79 56 88 46" stroke="#7563ee" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path class="pip-star" d="M90 32 l4.2 8.6 9.4 1.4 -6.8 6.6 1.6 9.4 -8.4 -4.4 -8.4 4.4 1.6 -9.4 -6.8 -6.6 9.4 -1.4z" fill="#ffd35c" stroke="#f0b400" stroke-width="1.5" stroke-linejoin="round"/>
        <rect x="54" y="132" width="16" height="16" rx="8" fill="#5f4fd8"/>

(function ticks(){const g=$('#pipTicks');for(let a=15;a<180;a+=15){const r1=a%45===0?44:49,r2=55,p=x=>[80+x*Math.cos(a*D2R),134-x*Math.sin(a*D2R)],A=p(r1),B=p(r2);mk('line',{x1:A[0],y1:A[1],x2:B[0],y2:B[1]},g);}})();
let lastMood='';
function renderPip(p){
  pipEl.style.opacity=clamp01(p.op);
  pipEl.style.transform=`translate(${p.x-80*p.s}px,${p.y-150*p.s}px) scale(${p.s})`;
  [[pupL,62],[pupR,98]].forEach(([el,ex])=>{
    const wx=p.x+(ex-80)*p.s,wy=p.y+(106-150)*p.s,dx=p.lx-wx,dy=p.ly-wy,d=Math.hypot(dx,dy)||1;
    el.setAttribute('transform',`translate(${(dx/d*4).toFixed(2)} ${(dy/d*4).toFixed(2)})`);
  });
  if(p.mood!==lastMood){pipEl.className='mood-'+p.mood;lastMood=p.mood;}
  if(p.mood==='point'){
    const left=p.lx<p.x,sx=p.x+(left?-60:60)*p.s,sy=p.y-34*p.s,ang=Math.atan2(p.ly-sy,p.lx-sx)/D2R;
    if(left){armL.style.transform=`rotate(${(ang-180).toFixed(1)}deg)`;armR.style.transform='';}
    else{armR.style.transform=`rotate(${ang.toFixed(1)}deg)`;armL.style.transform='';}
  }else{armL.style.transform='';armR.style.transform='';}
}
function render(){
  const w=World.cur;if(!w)return;
  renderDiag(D1,w.d1);renderDiag(D2,w.d2);renderPip(w.pip);

/* ---------- effects ---------- */
const SPARK_COLS=['#ffd35c','#ff7aa8','#8b77ff','#7fe0bd','#86c8ff','#ffb48f'];
function sparkle(x,y,n=12,spread=90){
  if(REDUCED)n=Math.min(n,4);
  const fx=$('#fx');
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';
    s.style.background=SPARK_COLS[i%SPARK_COLS.length];const sz=0.6+Math.random()*0.9;
    const a=Math.random()*Math.PI*2,r=spread*(0.45+Math.random()*0.7);
    fx.appendChild(s);
    s.animate([{transform:`translate(0,0) scale(0) rotate(0deg)`,opacity:1},
      {transform:`translate(${Math.cos(a)*r*.7}px,${Math.sin(a)*r*.7}px) scale(${sz*1.3}) rotate(90deg)`,opacity:1,offset:.6},
      {transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r+20}px) scale(0) rotate(160deg)`,opacity:0}],
      {duration:900+Math.random()*500,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove();
  }
}
function wedgeStage(dk,k,outer=false){const s=World.cur[dk];return toStage(s,wedgeLabelPt(s,k,outer));}
function sparkWedge(k,n=14,dk='d1'){const p=wedgeStage(dk,k,false);sparkle(p[0],p[1],n);}

    sparkWedge(i===1?'Q_UR':i===0?'P_LL':'P_UL',16);
    const nb=document.createElement('button');nb.className='btn primary';nb.style.marginTop='18px';nb.textContent=i<2?'Next question →':'Finish quiz ★';
    nb.onclick=()=>{blurBtn();st.cheer=false;S.show(i+1);};$('[data-b=after]',box).appendChild(nb);
  },
  next(){

    const box=$('[data-b=quiz]',curEl),fb=$('.fb',box);fb.className='fb hint';fb.textContent='Choose an answer first — take your time!';emph(box);return true;
  }
});

/* ---------------- 8. Case Closed ---------------- */

  html:()=>`<div class="kicker" data-morph="kicker">Chapter 7 · Case closed</div>

/* =====================================================================
   TRANSITION MANAGER (HTML layer) + NAVIGATION
   ===================================================================== */
let scale=1;
const stage=$('#stage'),slidesLayer=$('#slides');
function relRect(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{left:(r.left-s.left)/scale,top:(r.top-s.top)/scale,width:r.width/scale,height:r.height/scale};}
const MORPH_EASE='cubic-bezier(.65,0,.35,1)';
function flip(o,n,dur){
  const a=relRect(o),b=relRect(n);if(!a.height||!b.height)return false;
  const k=Math.min(a.height/b.height,a.width/b.width),dx=a.left-b.left,dy=a.top-b.top;
  n.style.transformOrigin=o.style.transformOrigin='0 0';
  n.animate([{transform:`translate(${dx}px,${dy}px) scale(${k})`,opacity:0},{opacity:1,offset:.45},{transform:'none',opacity:1}],{duration:dur,easing:MORPH_EASE,fill:'backwards'});
  o.animate([{transform:'none',opacity:1},{opacity:0,offset:.5},{transform:`translate(${-dx}px,${-dy}px) scale(${1/k})`,opacity:0}],{duration:dur,easing:MORPH_EASE,fill:'forwards'});
  return true;
}
function htmlTransition(oldEl,newEl,dir,allowMorph){
  const dur=950*MS(),newM=new Set(),oldM=new Set();
  if(oldEl){
    oldEl.classList.add('leaving');
    if(allowMorph&&!REDUCED){
      $$('[data-morph]',newEl).forEach(n=>{const o=$(`[data-morph="${n.dataset.morph}"]`,oldEl);if(o&&flip(o,n,dur)){newM.add(n);oldM.add(o);}});
    }
    [...oldEl.children].forEach(ch=>{
      if(oldM.has(ch))return;
      if(ch.querySelector&&[...oldM].some(m=>ch.contains(m))){ // container of a morphing element: fade its other children
        [...ch.children].forEach(cc=>{if(!oldM.has(cc))cc.animate([{opacity:1},{opacity:0}],{duration:300*MS(),fill:'forwards'});});return;}
      ch.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-36*dir}px)`}],{duration:360*MS(),easing:'ease-in',fill:'forwards'});
    });
    setTimeout(()=>oldEl.remove(),dur+120);
  }
  let i=0;
  const enterEl=ch=>{ch.animate([{opacity:0,transform:`translateX(${46*dir}px)`},{opacity:1,transform:'none'}],{duration:640*MS(),delay:((oldEl?320:120)+i*90)*MS(),easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});i++;};
  [...newEl.children].forEach(ch=>{
    if(newM.has(ch))return;
    if(ch.classList.contains('build')&&!ch.classList.contains('in'))return;
    if([...newM].some(m=>ch.contains(m))){[...ch.children].forEach(cc=>{if(!newM.has(cc))enterEl(cc);});return;}
    enterEl(ch);
  });
}
function goTo(i){
  if(i<0||i>=SLIDES.length)return;
  const dir=i>=cur?1:-1,oldEl=curEl,S=Object.create(SLIDES[i]);curS=S;
  gen++;S.g=gen;S.st={};
  const el=document.createElement('section');el.className='slide';el.setAttribute('aria-label',`Slide ${i+1}: ${S.name}`);
  el.innerHTML=S.html();slidesLayer.appendChild(el);
  const prevIdx=cur;cur=i;curEl=el;
  htmlTransition(oldEl,el,dir,i!==0||prevIdx===-1);
  updateChrome();
  S.enter(el);
}
function next(){const S=curS;if(S&&S.next&&S.next())return;if(cur<SLIDES.length-1)goTo(cur+1);}
function prev(){if(cur>0)goTo(cur-1);}
function updateChrome(){
  $('#count').innerHTML=`${P2(cur+1)} <small>/ ${P2(SLIDES.length)}</small>`;
  $('#prog i').style.width=((cur+1)/SLIDES.length*100)+'%';
  const S=SLIDES[cur];$('#notes').innerHTML=`<h4>Slide ${cur+1} · ${S.time}</h4><div class="nt">${S.name}</div>${S.notes}<div style="margin-top:10px;color:#a59ed6;font-size:13px">Keys: → / Space next · ← back · N notes · F fullscreen</div>`;
}

/* ---------- layout & chrome ---------- */
function layout(){
  const W=innerWidth,H=innerHeight,bar=66,pad=Math.min(16,W*0.02);
  scale=Math.min((W-pad*2)/1600,(H-bar-pad)/900);
  const x=(W-1600*scale)/2,y=Math.max(pad*0.6,(H-bar-900*scale)/2);
  stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
}
addEventListener('resize',layout);layout();
$('#bNext').onclick=()=>next();$('#bPrev').onclick=()=>prev();
$('#bRestart').onclick=()=>goTo(0);
$('#bNotes').onclick=()=>{$('#notes').classList.toggle('show');$('#bNotes').classList.toggle('on');};
function setReduced(v){REDUCED=v;document.body.classList.toggle('reduced',v);$('#bMotion').classList.toggle('on',v);$('#bMotion').title=v?'Reduced motion: ON':'Reduce motion';}
$('#bMotion').onclick=()=>setReduced(!REDUCED);setReduced(REDUCED);
function toggleFull(){if(!document.fullscreenElement){(document.documentElement.requestFullscreen||function(){}).call(document.documentElement);}else document.exitFullscreen&&document.exitFullscreen();}
$('#bFull').onclick=toggleFull;
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key===' '){if(tag==='button')return;e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='n'||e.key==='N')$('#bNotes').click();
  else if(e.key==='f'||e.key==='F')toggleFull();
});
// After clicking a chrome button, drop focus so Space/arrows keep driving the deck
$$('#bar button').forEach(b=>b.addEventListener('click',()=>b.blur()));

goTo(0);
</script>
